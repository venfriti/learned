<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learned: learn it step by step, and get unstuck</title>
<meta name="description" content="Learned is a visual, slide-based learning app for Nigerian students. Tap “I don’t get this” on any slide for a cited side page. Proof of concept.">
<meta name="theme-color" content="#0B1B2B">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/sora-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/present.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="brand" href="/" aria-label="Learned, home"><img src="/icon.svg" alt=""><span>Learned</span></a>
    <nav class="nav" aria-label="Site">
      <a href="/" aria-current="page">Presentation</a>
      <a href="/try/">Try the app</a>
      <details>
        <summary>Downloads</summary>
        <div class="menu">
          <a href="/downloads/Learned-presentation.pptx" download>Presentation (PowerPoint)</a>
          <a href="/downloads/Learned-how-to-use.pdf" download>How to use (PDF)</a>
        </div>
      </details>
    </nav>
    <span class="spacer"></span>
    <span class="chip">Proof of concept · sample content</span>
    <div class="ctl">
      <button id="prev" type="button" aria-label="Previous slide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span id="count" class="count" aria-hidden="true">1 / 18</span>
      <button id="next" type="button" aria-label="Next slide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <button id="full" type="button" aria-label="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </header>
  <main class="layout">
    <div class="slides" id="slides">
      <noscript><p style="padding:24px;color:#0B1B2B">This presentation needs JavaScript. You can download it from <a href="/downloads/Learned-presentation.pptx">Downloads</a>, or <a href="/app/">open the app</a>.</p></noscript>
    </div>
    <aside class="rail" aria-label="Live app preview">
      <div class="railhead"><span class="dot"></span><span>Live preview — try it as you read</span></div>
      <div class="stagebox" id="phonebox">
        <div class="scaler" id="phonescaler">
          <div class="frame" id="phoneframe" style="width:390px;height:844px">
            <iframe id="phoneiframe" src="/app/#/Main" title="Learned app, live demo" allow="fullscreen"></iframe>
          </div>
        </div>
      </div>
      <a class="raillink" href="/app/" target="_blank" rel="noopener">Open in its own tab ↗</a>
    </aside>
  </main>
  <div id="live" class="sr" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></div>
</div>
<script src="/qr.js"></script>
<script src="/present.js"></script>
</body>
</html>
